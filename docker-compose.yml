version: "3.9"

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  back-end:
    build: ./back-end
    container_name: back-end
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/spotifyAula
    depends_on:
      - mongo

  front-end:
    build: ./front-end
    container_name: front-end
    ports:
      - "3000:3000"
    depends_on:
      - back-end

volumes:
  mongo_data:
